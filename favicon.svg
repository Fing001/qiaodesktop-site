<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 140 744 744" width="1024" height="1024" role="img" aria-labelledby="t">
  <title id="t">QiaoDesktop 巧桌面</title>
  <desc>三盒上下堆叠、前后等距错位——最远盒最亮、中盒背衬、前盒主蓝；前盒内 2×2 四格：左上白块内字母 Q（几何圆环 + 45° 胶囊尾）、右上暖琥珀、左下青绿、右下白块内字母 D（左竖条（左角圆）+ 右半环）。字母为纯几何构造，不依赖任何字体。透明底，无底板</desc>

  <!-- 最远盒（先画，被盖住大半） -->
  <rect x="140" y="140" width="540" height="540" rx="102" ry="102" fill="#A9CDF7"/>

  <!-- 中盒：背衬，偏左上露出上/左边条 -->
  <rect x="242" y="242" width="540" height="540" rx="102" ry="102" fill="#90C1FF"/>

  <!-- 前盒：主蓝 -->
  <rect x="344" y="344" width="540" height="540" rx="102" ry="102" fill="#58A6FF"/>

  <!-- 前盒 2×2 四格：左上白块（Q）/ 右上琥珀 / 左下青绿 / 右下白块（D） -->
  <rect x="434" y="434" width="138" height="138" rx="33" ry="33" fill="#EEF4FC"/>
  <rect x="656" y="434" width="138" height="138" rx="33" ry="33" fill="#FFB454"/>
  <rect x="434" y="656" width="138" height="138" rx="33" ry="33" fill="#3ECFB2"/>
  <rect x="656" y="656" width="138" height="138" rx="33" ry="33" fill="#EEF4FC"/>

  <!-- 字母 Q：圆环（中心线 r=40.34，笔画 21.44，与外圆/内圆同心）+ 45° 胶囊尾 -->
  <g fill="none" stroke="#58A6FF" stroke-width="21.44">
    <circle cx="503" cy="503" r="40.34"/>
    <line x1="529.0" y1="529.0" x2="545.93" y2="545.93" stroke-linecap="round"/>
  </g>

  <!-- 字母 D：左竖条（左角圆 20）+ 上/下横条 + 右半环；
       内孔（counter）垂直范围跟随笔画收缩，外/内两条子路径以 evenodd 挖空 -->
  <path d="M701.09 673.94 H717.85 A51.06 51.06 0 0 1 717.85 776.06 H701.09 A20 20 0 0 1 681.09 756.06 V693.94 A20 20 0 0 1 701.09 673.94 Z M716.53 695.39 H717.85 A29.61 29.61 0 0 1 717.85 754.61 H716.53 A14 14 0 0 1 702.53 740.61 V709.39 A14 14 0 0 1 716.53 695.39 Z"
        fill="#58A6FF" fill-rule="evenodd"/>
</svg>
